name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Release APK
      working-directory: ./android
      run: gradle assembleRelease --stacktrace

    - name: Rename APK for release
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk MichelleDeSanta.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: michelle-de-santa-apk
        path: MichelleDeSanta.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.3
        name: "Michelle De Santa 3D v1.0.3 — GTA 3 Liberty City Style & Crash Fixes"
        body: |
          🏙️ **Michelle De Santa 3D — GTA 3 Liberty City Edition (v1.0.3)**

          *Reliable Friend • Calm & Serious • Loyal Companion*

          ### 💥 Что нового и исправлено в v1.0.3:
          - 🚗 **Полное исправление посадки/высадки из машины**:
            - Устранён краш WebAudio осциллятора (двигатель глушится и заводится синхронно и безопасно без зависаний).
            - Реализована безопасная высадка (проверка коллизий со всех сторон машины исключает спавн внутри стен или падение под карту).
            - Защита игрового цикла `requestAnimationFrame` от любых необработанных исключений и NaN-координат.
          - 🌆 **Графика и атмосфера в стиле GTA 3 (Liberty City / Portland)**:
            - Фирменный сланцево-синий ночной туман Либерти-Сити.
            - Тёмный асфальт с двойной жёлтой осевой разметкой и зебрами.
            - Жёлтые кэбы Borgnine Cabs с шашечками на крыше, припаркованные вдоль улиц.
            - Ретро-неоновые вывески, кирпичные фасады, чугунные пожарные лестницы, фонари с тёплыми гало-лучами.
          - 📟 **Аутентичный GTA 3 HUD**:
            - Розовое сердечко здоровья (`♥ 100`) и синяя броня (`★ 100`).
            - Зелёный счётчик наличных с ведущими нулями (`$00001200`).
            - Часы Либерти-Сити в верхнем углу (`22:45`).
            - Звёзды розыска.
            - Круглый радар-миникарта с желтой окантовкой и маркером севера "N" в левом нижнем углу.
            - Выезжающая снизу справа плашка с названием машины: **DE SANTA ROADSTER V8** при посадке за руль.
            - Эпичная победная заставка **MISSION PASSED!** с торжественными фанфарами при прохождении миссий.

          ### 📦 Загрузка и запуск:
          - **macOS**: `MichelleDeSanta-macOS.zip` (распаковать и запустить `MichelleDeSanta.app`).
          - **Android**: `MichelleDeSanta.apk` (установить APK на Android телефон/планшет).
          - **Web / Онлайн**: https://slawastr.github.io/michelle-de-santa-3d/
        files: |
          MichelleDeSanta.apk
          MichelleDeSanta-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
