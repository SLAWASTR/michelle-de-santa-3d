name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Release APK
      working-directory: ./android
      run: gradle assembleRelease --stacktrace

    - name: Rename APK for release
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk MichelleDeSanta.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: michelle-de-santa-apk
        path: MichelleDeSanta.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.4
        name: "Michelle De Santa 3D v1.0.4 — Launch Freeze Fix & Enhanced Graphics"
        body: |
          🏙️ **Michelle De Santa 3D — Definitive Liberty City Edition (v1.0.4)**

          *Reliable Friend • Calm & Serious • Loyal Companion*

          ### 💥 Что исправлено и улучшено в v1.0.4:
          - 🚀 **Устранено зависание при запуске**:
            - Найден и исправлен сбой в цикле анимации выхлопных газов (`updateExhaustPuffs` обращался к неинициализированному вектору скорости, что блокировало `renderer.render()` на первом кадре).
            - Нативный логгер ошибок перенаправляет консоль JS в системный вывод, гарантируя полную стабильность приложения.
          - 🌆 **Существенно улучшена 3D графика**:
            - **Эстакада метро Portland El-Train**: над центральным проспектом возведена стальная эстакада метрополитена на массивных опорах с проходящим сине-серебристым поездом и светящимися окнами.
            - **Пар из канализационных люков**: на перекрёстках из решёток поднимается анимированный клубящийся пар в духе нуарного Либерти-Сити.
            - **Освещение и асфальт**: мокрый асфальт с реалистичными зеркальными отражениями неоновых вывесок и фар, сланцево-синий туман и кинематографичный лунный свет.
            - **Детализация родстера V8**: глянцевый чёрный обсидиановый кузов, хромированные бамперы и объёмные лучи фар, прорезающие туман.
          - 📟 **Полноценный GTA 3 HUD**:
            - Индикатор здоровья `♥ 100`, брони `★ 100`, зелёный счётчик денег с ведущими нулями (`$00001200`), часы и круглый радар.
            - Выезжающая плашка **DE SANTA ROADSTER V8** со спидометром и победный баннер **MISSION PASSED!**

          ### 📦 Загрузка и запуск:
          - **macOS**: `MichelleDeSanta-macOS.zip` (распаковать и запустить `MichelleDeSanta.app`).
          - **Android**: `MichelleDeSanta.apk` (установить APK на Android телефон/планшет).
          - **Web / Онлайн**: https://slawastr.github.io/michelle-de-santa-3d/
        files: |
          MichelleDeSanta.apk
          MichelleDeSanta-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
