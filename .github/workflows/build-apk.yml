name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Release APK
      working-directory: ./android
      run: gradle assembleRelease --stacktrace

    - name: Rename APK for release
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk MichelleDeSanta.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: michelle-de-santa-apk
        path: MichelleDeSanta.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.5
        name: "Michelle De Santa 3D v1.0.5 — Rockstar Dev Handling & Visual Masterpiece"
        body: |
          🏙️ **Michelle De Santa 3D — Rockstar Definitive Edition (v1.0.5)**

          *Reliable Friend • Calm & Serious • Loyal Companion*

          ### 🏎️ Полный оверхол управляемости и физики автомобиля:
          - ⚡ **Отзывчивый отклик и динамика**:
            - Мгновенный отклик на руль с адаптивным углом поворота колёс в зависимости от скорости.
            - Симуляция 4-ступенчатой коробки передач V8: мощный крутящий момент на 1-й передаче, натуральные провалы и набор оборотов RPM двигателя при переключении.
            - Глубокий звук V8: сдвоенный осциллятор с саб-басовым урчанием на низких частотах и рычащим выхлопом при разгоне.
          - 💨 **Механика управляемого заноса (Дрифт) и следы шин**:
            - Зажатие ручника (Пробел / кнопка прыжка) срывает заднюю ось в эффектный, контролируемый пауэр-слайд с возможностью контр-руления.
            - Визуальные черные следы жжёной резины (Skid Marks) на асфальте под задними колёсами.
            - Дым из-под задних покрышек при дрифте и резком старте + реалистичный визг шин (Tire Squeal).
          - 🔴 **Активные стоп-сигналы и задний ход**:
            - Задние фонари ярко вспыхивают красным неоном при торможении и заднем ходе.
            - Белые лампы заднего хода загораются при движении назад.
          - 💥 **Искры при скольжении**: скрежет металла и сноп ярких жёлто-оранжевых искр при боковом контакте со стенами.
          - 🎥 **Кинематографичная камера Rockstar**:
            - Висцеральная тряска камеры на скорости свыше 30 км/ч.
            - Мгновенный взгляд назад (правая кнопка мыши или клавиши B/R).

          ### 🌆 Графический шедевр Liberty City (Portland District):
          - 🚇 **Движущийся поезд метро**: по стальной эстакаде над проспектом с гулом периодически проносится поезд с горящими окнами.
          - 🌧️ **Зеркальные лужи на мокром асфальте**: лужи у обочин с высоким коэффициентом отражения неоновых вывесок и лунного света.
          - 🪜 **Пожарные лестницы и водонапорные башни**: на кирпичных домах установлены чугунные пожарные лестницы, а на крышах — классические деревянные бочки с коническими крышами.
          - 💡 **Культовые неоновые вывески**: 
            - «DE SANTA LOUNGE» (розовый и циан)
            - «8-BALL'S AUTOS & BOMBS» в Восточном переулке (оранжевый и лазурный)
            - «AMMU-NATION» (кроваво-красный и золотой)
            - «SANTA TRUST BANK» и «GRAND AUDITORIUM»
          - 💨 **Клубящийся пар**: из 4 канализационных люков на перекрёстках поднимается густой пар.

          ### 📦 Загрузка и запуск:
          - **macOS**: `MichelleDeSanta-macOS.zip` (распаковать и запустить `MichelleDeSanta.app`).
          - **Android**: `MichelleDeSanta.apk` (установить APK на Android телефон/планшет).
          - **Web / Онлайн**: https://slawastr.github.io/michelle-de-santa-3d/
        files: |
          MichelleDeSanta.apk
          MichelleDeSanta-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
